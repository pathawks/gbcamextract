[package]
name = "gbcamextract"
version = "1.1.0"
edition = "2021"
description = "Extracts photos from Game Boy Camera / Pocket Camera saves"
license = "MIT"

[[bin]]
name = "gbcamextract"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
gamut-bitstream = "0.2"
gamut-isobmff = "2"
rayon = "1.10"
